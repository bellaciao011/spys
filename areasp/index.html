<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stalkea — Secure Diagnostic Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="cdn.jsdelivr.net/npm/bootstrap%405.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/deliverable.css" rel="stylesheet">
    <link href="assets/css/panel-theme.css" rel="stylesheet">
    <link href="assets/css/contrast-fixes.css" rel="stylesheet">
</head>
<body class="panel-shell">
    <div class="panel-page">
        <div class="panel-brand">
            <div class="panel-brand-icon">🛡️</div>
            <h1>Stalkea</h1>
            <p class="panel-tagline">Secure diagnostic panel</p>
        </div>

        <div class="panel-card">
            <div data-progress-bar></div>

            <div class="panel-auth-tabs" role="tablist">
                <button type="button" class="panel-auth-tab active" data-tab="signin" id="tab-signin">Sign in</button>
                <button type="button" class="panel-auth-tab" data-tab="register" id="tab-register">Register</button>
            </div>

            <h2 id="panel-auth-title">Welcome back</h2>
            <p class="panel-sub" id="panel-auth-sub">Enter your email to access your panel — no password needed.</p>

            <form novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="you@email.com" required>
                    <div class="invalid-feedback">Please enter a valid email.</div>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Remember me on this device</label>
                </div>
                <button type="submit" class="btn btn-panel-access">Access Panel</button>
            </form>

            <p class="text-center mt-3 mb-0">
                <a href="chat/" class="panel-link">Need help? 24/7 Support</a>
            </p>

            <p class="panel-trust mb-0">
                End-to-end encrypted · One number per account
            </p>
        </div>
    </div>

    <div class="panel-footer">
        <p class="mb-0">Stalkea © 2026 · Authorized auditing only</p>
    </div>

    <script src="code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="cdnjs.cloudflare.com/ajax/libs/jquery-cookie/1.4.1/jquery.cookie.min.js"></script>
    <script src="cdn.jsdelivr.net/npm/%40popperjs/core%402.11.6/dist/umd/popper.min.js"></script>
    <script src="cdn.jsdelivr.net/npm/bootstrap%405.3.0/dist/js/bootstrap.min.js"></script>
    <script src="assets/js/progress.js"></script>
    <script src="assets/js/deep-analysis.js"></script>
    <script src="assets/js/email-dispatch.js?v=20260706c"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/login.js?v=20260706c"></script>
</body>
</html>
