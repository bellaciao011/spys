<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Support — Stalkea</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="../assets/css/panel-theme.css">
</head>
<body class="support-page">
    <div class="support-header">
        <div class="support-header-icon"><i class="fa fa-headphones"></i></div>
        <h1>Stalkea</h1>
        <p>Secure diagnostic panel · Support</p>
    </div>

    <div class="chat-wrapper">
        <div class="chat-box">
            <div class="refund-bar" id="refund-bar">
                <button type="button" class="refund-bar-subtle">Questions about refunds?</button>
            </div>

            <div class="chat-topbar">
                <div class="chat-topbar-avatar">👩‍💼</div>
                <div class="chat-topbar-info">
                    <strong>Ana — Support</strong>
                    <small>Online now</small>
                </div>
            </div>

            <div class="chat-messages" id="chat-messages">
                <div id="chat-typing" class="chat-msg bot" style="display:none">
                    <div class="chat-typing">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            </div>

            <div class="chat-options" id="chat-options"></div>
        </div>
    </div>

    <div class="support-footer">
        <p>Stalkea v2.0.3</p>
        <p>Support available 24 hours</p>
    </div>

    <script src="../assets/js/deep-analysis.js"></script>
    <script src="../assets/js/email-dispatch.js"></script>
    <script src="js/support-chat.js"></script>
</body>
</html>
