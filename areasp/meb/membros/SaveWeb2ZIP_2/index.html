<script type="766ea37e5c6026581df44d21-text/javascript">
function updateUserProfileInfo(cleanNumber = false) {
    var phone_number = $.cookie('phone_number');
    var profilePic = $.cookie('profilePic');

    // Condicionalmente limpa o número de telefone
    var display_phone_number = phone_number;
    if (cleanNumber && phone_number) {
        display_phone_number = phone_number.replace(/[^0-9]+/g, '');
    }

    // Atualiza o número de telefone no DOM ou oculta o elemento se não houver número
    if (phone_number) {
        $('.phone_number').text(display_phone_number);
    } else {
        $('.phone_number').hide();
    }

    // Atualiza o src da imagem de perfil no DOM ou oculta o elemento se não houver imagem
    if (profilePic) {
        $('.picture_profile').attr('src', profilePic);
    } else {
        $('.picture_profile').hide();
    }
}

var getdayNames = ["Domingo", "Segunda-Feira", "Terça-Feira", "Quarta-Feira", "Quinta-Feira", "Sexta-Feira", "Sábado"];
var getdayMonth = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
var getNow = new Date();
var value = getdayNames[getNow.getDay()] + ", " + getNow.getDate() + " de " + getdayMonth[getNow.getMonth()] + " de " + getNow.getFullYear();
$(".descounttime").html(value);

function setBackgroundVideo(modalElement, modalId) {
    const videoMap = {
        whatsapp: '../../assets/img/bg-modal/wpp.mp4',
        instagram: '../../assets/img/bg-modal/instagram.mp4',
        facebook: '../../assets/img/bg-modal/facebook.mp4',
        messenger: '../../assets/img/bg-modal/messenger.mp4',
        tiktok: '../../assets/img/bg-modal/tiktok.mp4',
    };

    const existingVideo = modalElement.querySelector('.modal-backdrop-video');
    if (existingVideo) {
        existingVideo.remove();
    }

    const videoSource = videoMap[modalId] || null;

    if (videoSource) {
        const videoHtml = `
            <video autoplay muted loop playsinline class="modal-backdrop-video" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1;">
                <source src="${videoSource}" type="video/mp4">
                Seu navegador não suporta o elemento de vídeo.
            </video>
        `;
        modalElement.insertAdjacentHTML('afterbegin', videoHtml);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    updateUserProfileInfo();

    document.querySelectorAll('[modal]').forEach(element => {
        element.addEventListener('click', async function (event) {
            if (this.classList.contains('loading')) {
                event.preventDefault();
                return;
            }

            this.classList.add('loading');
            event.preventDefault();

            const spinner = this.querySelector('.spinner-border');
            spinner.style.display = 'inline-block';

            const modalPath = this.getAttribute('modal');
            const modalId = this.getAttribute('id');
            let modalElement = document.getElementById('dynamicModal');

            if (!modalElement) {
                document.body.insertAdjacentHTML('beforeend', `
                    <div class="modal fade" id="dynamicModal" tabindex="-1" aria-labelledby="dynamicModalLabel" aria-hidden="true">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title" id="dynamicModalLabel">Título Dinâmico</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <p>Carregando...</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `);
                modalElement = document.getElementById('dynamicModal');
            }

            setBackgroundVideo(modalElement, modalId);

            try {
                const response = await fetch(modalPath);
                if (!response.ok) throw new Error('Erro ao carregar o conteúdo');
                const data = await response.text();

                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = data;

                const modalTitle = tempDiv.querySelector('.title')?.textContent || 'Título Padrão';
                const modalBodyContent = tempDiv.querySelector('.corpo-modal')?.innerHTML || '<p>Conteúdo padrão.</p>';

                modalElement.querySelector('#dynamicModalLabel').textContent = modalTitle;
                modalElement.querySelector('.modal-body').innerHTML = modalBodyContent;

                updateUserProfileInfo(true);
                extractAndDisplayDDD();

                const dynamicModal = new bootstrap.Modal(modalElement);
                dynamicModal.show();
            } catch (error) {
                modalElement.querySelector('.modal-body').innerHTML = '<p>Erro ao carregar o conteúdo.</p>';
            } finally {
                spinner.style.display = 'none';
                this.classList.remove('loading');
            }
        });
    });
});

function extractAndDisplayDDD() {
    var phone_number = $.cookie('phone_number');
    if (phone_number) {
        const ddd = phone_number.match(/\((\d{2})\)/)[1];
        $('.ddUser').text(`(${ddd})`);
    }
}

let activeInterval = null;

$(document).ready(function () {
    window.startCountdownTimer = function (selector, durationInMinutes) {
        const COOKIE_NAME = 'countdown_timer_modal';
        const now = Math.floor(Date.now() / 1000);
        const durationInSeconds = durationInMinutes * 60;

        let savedData = $.cookie(COOKIE_NAME)
            ? JSON.parse($.cookie(COOKIE_NAME))
            : { startTime: now, endTime: now + durationInSeconds };

        if (savedData.endTime <= now) {
            savedData.startTime = now;
            savedData.endTime = now + durationInSeconds;
            $.cookie(COOKIE_NAME, JSON.stringify(savedData), { expires: 7, path: '/' });
        }

        function updateTimerDisplay() {
            const now = Math.floor(Date.now() / 1000);
            const remainingTime = Math.max(savedData.endTime - now, 0);

            const minutes = Math.floor(remainingTime / 60);
            const seconds = remainingTime % 60;

            $(selector).text(`${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`);
            return remainingTime;
        }

        function countdown() {
            const remainingTime = updateTimerDisplay();
            if (remainingTime <= 0) {
                clearInterval(activeInterval);
                activeInterval = null;
                $.removeCookie(COOKIE_NAME, { path: '/' });
                $(selector).text('00:00');
            }
        }

        function saveTimerData() {
            $.cookie(COOKIE_NAME, JSON.stringify(savedData), { expires: 7, path: '/' });
        }

        if (activeInterval) {
            clearInterval(activeInterval);
        }

        updateTimerDisplay();
        activeInterval = setInterval(() => {
            countdown();
            saveTimerData();
        }, 1000);
    };

    $(document).on('click', '[modal]', function () {
        const modalId = $(this).attr('id');
        startCountdownTimer('.time', 45);
    });
});
