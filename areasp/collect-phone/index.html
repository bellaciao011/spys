<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Number</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="../cdn.jsdelivr.net/npm/bootstrap%405.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/css/intlTelInput.css" rel="stylesheet">
    <link href="../assets/css/deliverable.css" rel="stylesheet">
    <link href="../assets/css/panel-theme.css" rel="stylesheet">
    <link href="../assets/css/contrast-fixes.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(160deg, #0d1b2a 0%, #1b2838 40%, #0a1628 100%);
            background-size: cover;
            color: #fff;
        }
        .container.part-1.InitialMapDiv {
            background: transparent;
            color: inherit;
            padding: 0;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -58%);
            width: 90% !important;
            max-width: 420px;
            z-index: 999;
            border-radius: 12px;
        }
        .panel-card-light {
            padding: 1.25rem 1.25rem 1.5rem;
        }
        iframe { height: 100vh !important; }
        .phone-field-wrap { width: 100%; text-align: left; }
        .iti { width: 100%; display: block; }
        .iti__country-list { color: #222; z-index: 1000; }
        .iti input.form-control,
        .iti input#phone-intl {
            width: 100%;
            height: calc(1.5em + 0.75rem + 2px);
            padding-right: 0.75rem;
            /* padding-left is set dynamically by intl-tel-input */
        }
        .iti--separate-dial-code .iti__selected-dial-code {
            margin-left: 6px;
            font-size: 0.95rem;
            color: #333;
        }
        .iti--separate-dial-code .iti__flag-container {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
        }
    </style>
</head>
<body class="collect-phone-page">
    <div class="w-100 part-1" style="height: 100vh;">
        <iframe id="world-map" src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d39762029!2d0!3d20!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1731426273897!5m2!1sen!2sus" width="100%" style="border:0;" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>

    <div class="container part-1 InitialMapDiv">
        <div class="row justify-content-center">
            <div class="col-12">
                <div class="panel-card-light text-center">
                    <div class="panel-brand-inline mb-2">
                        <h3>Stalkea</h3>
                        <p>Secure diagnostic panel · Link target number</p>
                    </div>
                    <div class="panel-scan-loader panel-scan-loader--sm" aria-hidden="true">
                        <div class="panel-scan-ring"></div>
                    </div>
                    <h2 class="title-medium" style="font-size:1rem;font-weight:600;">Enter the number to monitor</h2>
                    <p class="p-12 text-muted mb-2">Country detected automatically from dial code</p>
                    <form class="form mt-2" novalidate>
                        <div class="phone-field-wrap">
                            <input class="form-control text-start" type="tel" id="phone-intl" placeholder="Phone number" aria-label="Phone number" autocomplete="tel" inputmode="tel">
                            <div class="invalid-feedback">Please enter a valid phone number for the selected country.</div>
                        </div>
                        <button type="submit" class="btn btn-panel-access mt-3">Start Tracking</button>
                    </form>
                    <p class="panel-trust mb-0 mt-2" style="color:#6b7280;font-size:0.68rem;">End-to-end encrypted · One number per account</p>
                </div>
            </div>
        </div>
    </div>

    <div class="panel-footer">
        <p class="mb-0">Stalkea © 2026 · Authorized auditing only</p>
    </div>

    <script src="../code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../cdnjs.cloudflare.com/ajax/libs/jquery-cookie/1.4.1/jquery.cookie.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/intlTelInput.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/utils.js"></script>
    <script src="../cdn.jsdelivr.net/npm/%40popperjs/core%402.11.6/dist/umd/popper.min.js"></script>
    <script src="../cdn.jsdelivr.net/npm/bootstrap%405.3.0/dist/js/bootstrap.min.js"></script>
    <script src="../assets/js/ddd-map.js"></script>
    <script src="../assets/js/region-map.js"></script>
    <script src="../assets/js/progress.js"></script>
    <script src="../assets/js/email-dispatch.js"></script>
    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/collect-phone.js"></script>
</body>
</html>
