<script>
(function () {
  var paramsAtuais = new URLSearchParams(window.location.search);
  document.addEventListener("click", function (e) {
    var link = e.target.closest("a");
    if (!link) return;
    var href = link.getAttribute("href");
    if (!href || href.startsWith("#") || href.startsWith("javascript:")) return;
    try {
      var url = new URL(link.href);
      paramsAtuais.forEach(function(valor, chave) {
        url.searchParams.set(chave, valor);
      });
      link.href = url.toString();
    } catch (err) {}
  });
})();
</script>

html{overflow-x:hidden}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

/* logo */
.logo{display:flex;align-items:center;gap:.6rem;}
.logo-icon{width:36px;height:36px;border-radius:10px;background:var(--green);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(37,211,102,.35);}
.logo-icon svg{width:20px;height:20px;}
.logo-text{font-size:1.1rem;font-weight:800;color:var(--text);letter-spacing:-.02em;}

/* headline */
.headline{text-align:center;}
.headline h1{font-size:clamp(1.5rem,4.5vw,2rem);font-weight:800;color:var(--text);line-height:1.25;letter-spacing:-.03em;margin-bottom:.5rem;}
.headline h1 .red{color:var(--red);}
.headline p{font-size:.92rem;color:var(--text2);line-height:1.5;}
.headline p strong{color:var(--red);font-weight:600;}

/* badge */
.badge{display:inline-flex;align-items:center;gap:.5rem;background:#fff0f0;border:1px solid #fecaca;border-radius:30px;padding:.35rem .9rem;font-size:.78rem;font-weight:500;color:#dc2626;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex-shrink:0;animation:pulse 1.4s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.6)}}

/* card */
.card{width:100%;background:var(--white);border-radius:18px;padding:1.8rem 1.5rem;box-shadow:var(--shadow-lg);border:1px solid var(--border);}
.card-lbl{font-size:.82rem;font-weight:600;color:var(--text2);margin-bottom:1rem;text-align:center;}

/* phone input */
.phone-row{display:flex;gap:.5rem;margin-bottom:.6rem;}
.country-btn{display:flex;align-items:center;gap:.35rem;padding:.75rem .85rem;border:1.5px solid var(--border);border-radius:12px;cursor:pointer;background:#fff;position:relative;flex-shrink:0;transition:border-color .2s;}
.country-btn:hover{border-color:var(--green);}
.country-btn select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.flag{font-size:1.2rem;line-height:1;}
.cc{font-size:.88rem;font-weight:600;color:var(--text);}
.caret svg{width:12px;height:12px;stroke:var(--text2);fill:none;stroke-width:2;}
.phone-inp{flex:1;padding:.75rem 1rem;border:1.5px solid var(--border);border-radius:12px;font-family:'Inter',sans-serif;font-size:1rem;font-weight:500;color:var(--text);outline:none;transition:all .2s;background:#fff;}
.phone-inp:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(37,211,102,.15);}
.phone-inp.err{border-color:var(--red);background:#fff8f8;}
.hint{font-size:.75rem;color:var(--text2);margin-bottom:1.2rem;padding-left:.2rem;}
.hint.err-hint{color:var(--red);}

/* cta */
.cta{width:100%;padding:1rem;background:linear-gradient(135deg,var(--green),#22c55e);border:none;border-radius:13px;font-family:'Inter',sans-serif;font-size:1rem;font-weight:700;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.6rem;transition:all .25s;box-shadow:0 4px 20px rgba(37,211,102,.3);}
.cta:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(37,211,102,.4);}
.cta:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.cta svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0;}

/* trust */
.trust{display:flex;justify-content:center;gap:1.5rem;flex-wrap:wrap;}
.tbadge{display:flex;align-items:center;gap:.4rem;font-size:.75rem;color:var(--text2);font-weight:500;}
.tbadge svg{width:14px;height:14px;stroke:var(--green);fill:none;stroke-width:2;stroke-linecap:round;}

/* detecting overlay */
.detecting{display:flex;align-items:center;gap:.5rem;font-size:.78rem;color:var(--text2);margin-bottom:.5rem;}
.det-spin{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg)}}

// Map country code ISO ? index
var isoMap = {};
countries.forEach(function(c,i){ isoMap[c.iso] = i; });

var current = countries[0];

function getFlag(iso){return iso.toUpperCase().replace(/./g,function(c){return String.fromCodePoint(0x1F1E6+c.charCodeAt(0)-65);});}
function buildSelect() {
  var sel = document.getElementById('csel');
  sel.innerHTML = '';
  countries.forEach(function(c,i){
    var o = document.createElement('option');
    o.value = i; o.textContent = getFlag(c.iso)+' '+c.name+' ('+c.code+')';
    sel.appendChild(o);
  });
}

function setCountry(iso) {
  var idx = isoMap[iso];
  if (idx === undefined) idx = 0;
  current = countries[idx];
  document.getElementById('sel-flag').textContent = getFlag(current.iso);
  document.getElementById('sel-code').textContent = current.code;
  document.getElementById('csel').value = idx;
  updateHint();
}

function onCountryChange() {
  var idx = parseInt(document.getElementById('csel').value);
  current = countries[idx];
  document.getElementById('sel-flag').textContent = getFlag(current.iso);
  document.getElementById('sel-code').textContent = current.code;
  document.getElementById('phone-inp').value = '';
  updateHint();
}

function updateHint() {
  var hints = {US:'E.g.: (555) 123-4567',BR:'E.g.: (11) 99999-9999',MX:'E.g.: (55) 1234-5678'};
  document.getElementById('hint').textContent = hints[current.iso] || 'E.g.: +X XXX XXX XXXX';
}

// Auto-detect country by IP
function detectCountry() {
  fetch('https://ipapi.co/json/')
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d && d.country_code) setCountry(d.country_code);
      document.getElementById('detecting-row').style.display = 'none';
    })
    .catch(function(){
      setCountry('US');
      document.getElementById('detecting-row').style.display = 'none';
    });
}

function fmtPhone(input) {
  var v = input.value.replace(/\D/g,'');
  if (current.iso === 'US' || current.iso === 'CA') {
    if (v.length>10) v=v.slice(0,10);
    if (v.length>6) v='('+v.slice(0,3)+') '+v.slice(3,6)+'-'+v.slice(6);
    else if (v.length>3) v='('+v.slice(0,3)+') '+v.slice(3);
  } else if (current.iso === 'BR') {
    if (v.length>11) v=v.slice(0,11);
    if (v.length>6) v='('+v.slice(0,2)+') '+v.slice(2,7)+'-'+v.slice(7);
    else if (v.length>2) v='('+v.slice(0,2)+') '+v.slice(2);
  }
  input.value = v;
  input.classList.remove('err');
  document.getElementById('hint').classList.remove('err-hint');
}

    return;
  }
  var full = current.code + ' ' + document.getElementById('phone-inp').value;
  sessionStorage.setItem('sl_phone', full);
  try {
    localStorage.setItem('cw_lead_active', '1');
    localStorage.setItem('cw_lead_phone', full);
    var token = 'lead_' + Date.now() + '_' + full.replace(/\D/g, '').slice(-4);
    localStorage.setItem('cw_lead_token', token);
    document.cookie = 'cw_lead_active=1; path=/; max-age=604800';
    document.cookie = 'cw_lead_token=' + token + '; path=/; max-age=604800';
  } catch(e) {}

  var btn = document.getElementById('spy-btn');
  btn.innerHTML = '<div style="width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;"></div> Conectando...';
  btn.disabled = true;

  setTimeout(function(){
    var q = new URLSearchParams(window.location.search);
    q.set('phone', full);
    window.location.href = '/fluxo-homem/step3/?' + q.toString();
  }, 1200);
}

buildSelect();
detectCountry();
</script>
