<!DOCTYPE html><html lang="en"><head>
<script>
(function () {
  var paramsAtuais = new URLSearchParams(window.location.search);
  document.addEventListener("click", function (e) {
    var link = e.target.closest("a");
    if (!link) return;
    var href = link.getAttribute("href");
    if (!href || href.startsWith("#") || href.startsWith("javascript:")) return;
    try {
      var url = new URL(link.href);
      paramsAtuais.forEach(function(valor, chave) {
        url.searchParams.set(chave, valor);
      });
      link.href = url.toString();
    } catch (err) {}
  });
})();
</script>

<style>
html{overflow-x:hidden}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--green:#25D366;--green-dark:#128C7E;--bg:#f0f2f5;--white:#fff;--text:#111b21;--text2:#667781;--border:#e9edef;--red:#ef4444;--shadow-lg:0 8px 32px rgba(0,0,0,.12);}
body{font-family:'Inter',sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1rem;}
.wrap{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:1.4rem;animation:up .5s ease both;}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.logo{display:flex;align-items:center;gap:.6rem;}
.logo-icon{width:40px;height:40px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(37,211,102,.3);}
.logo-icon svg{width:22px;height:22px;fill:#fff;}
.logo-text{font-size:1.3rem;font-weight:700;color:var(--green);letter-spacing:-.02em;}

/* LOADING CARD */
#screen-load{width:100%;}
.card{width:100%;background:var(--white);border-radius:18px;padding:2rem 1.5rem;box-shadow:var(--shadow-lg);border:1px solid var(--border);text-align:center;}
.spin-wrap{width:72px;height:72px;margin:0 auto 1.2rem;position:relative;}
.spin{width:72px;height:72px;border:3px solid #bbf7d0;border-top-color:var(--green);border-radius:50%;animation:spin .9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.load-title{font-size:1.2rem;font-weight:800;color:var(--text);margin-bottom:.3rem;}
.load-phone{font-size:.9rem;font-weight:600;color:var(--green-dark);margin-bottom:.8rem;}
.load-status{font-size:.82rem;color:var(--text2);min-height:1.3rem;margin-bottom:1.4rem;transition:opacity .2s;}
.prog-wrap{background:var(--bg);border-radius:20px;height:8px;overflow:hidden;margin-bottom:.5rem;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--green),#22c55e);border-radius:20px;width:0%;transition:width .3s ease;}
.prog-pct{font-size:.8rem;font-weight:700;color:var(--text);margin-bottom:1.5rem;}
.steps{display:flex;flex-direction:column;gap:.7rem;text-align:left;}
.step-item{display:flex;align-items:center;gap:.75rem;opacity:.35;transition:opacity .3s;}
.step-item.active{opacity:1;}
.step-item.done{opacity:.85;}
.step-ico{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.7rem;flex-shrink:0;transition:all .3s;}
.step-item.done .step-ico{background:var(--green);border-color:var(--green);font-size:0;}
.step-item.done .step-ico::after{content:'✓';font-size:.8rem;color:#fff;font-weight:700;}
.step-item.active .step-ico{border-color:var(--green);font-size:0;}
.step-item.active .step-ico::after{content:'';display:block;width:14px;height:14px;border:2px solid #bbf7d0;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;}
.step-txt{font-size:.88rem;font-weight:500;color:var(--text2);transition:color .3s;}
.step-item.done .step-txt,.step-item.active .step-txt{color:var(--text);}

/* PROFILE CARD */
#screen-profile{display:none;width:100%;flex-direction:column;gap:1rem;}
.prof-card{width:100%;background:var(--white);border-radius:18px;padding:2rem 1.5rem;box-shadow:var(--shadow-lg);border:1px solid var(--border);text-align:center;}
.av-wrap{width:80px;height:80px;margin:0 auto 1rem;border-radius:50%;border:3px solid var(--green);background:#f0fdf4;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.av-wrap svg{width:40px;height:40px;fill:#adb5bd;}
.av-wrap img{width:80px;height:80px;object-fit:cover;border-radius:50%;}
.prof-num{font-size:1.1rem;font-weight:700;color:var(--text);margin-bottom:.4rem;}
.reg-badge{display:inline-flex;align-items:center;gap:.4rem;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:20px;padding:.22rem .75rem;font-size:.75rem;font-weight:600;color:var(--green-dark);}
.reg-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse2 1.4s infinite;flex-shrink:0;}
@keyframes pulse2{0%,100%{opacity:1}50%{opacity:.4}}

.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-top:1.2rem;}
.stat-box{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:.9rem;text-align:center;}
.stat-box.stat-online{background:#f0fdf4;border-color:#bbf7d0;}
.stat-val{font-size:1.3rem;font-weight:800;color:var(--text);display:block;margin-bottom:.2rem;}
.stat-val.online-val{color:#15803d;font-size:1.05rem;display:flex;align-items:center;justify-content:center;gap:.35rem;}
.online-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block;animation:pulse2 1.4s infinite;}
.stat-val.scanning{font-size:.9rem;color:var(--red);animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.stat-lbl{font-size:.72rem;color:var(--text2);font-weight:500;}

/* CTA */
.cta{width:100%;padding:1rem;background:linear-gradient(135deg,var(--green),#22c55e);border:none;border-radius:13px;font-family:'Inter',sans-serif;font-size:1rem;font-weight:700;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.6rem;box-shadow:0 4px 20px rgba(37,211,102,.3);transition:all .25s;}
.cta:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(37,211,102,.4);}
.cta svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0;}

.change-btn{background:none;border:none;color:var(--text2);font-size:.82rem;font-weight:500;cursor:pointer;padding:.4rem;font-family:'Inter',sans-serif;transition:color .2s;text-align:center;}
.change-btn:hover{color:var(--text);}
</style>
</head>
<body>

  <div class="logo">
    <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"></path></svg></div>
    <span class="logo-text">ChatWatch - App View AI</span>
  </div>

  <!-- LOADING -->
  <div id="screen-load">
    <div class="card">
      <div class="spin-wrap"><div class="spin"></div></div>
      <div class="load-title">Accessing WhatsApp</div>
      <div class="load-phone" id="lphone">+1 (849) 961-7136</div>
      <div class="load-status" id="lstatus">Preparing access...</div>
      <div class="prog-wrap"><div class="prog-fill" id="pfill" style="width: 13%;"></div></div>
      <div class="prog-pct" id="ppct">13%</div>
      <div class="steps">
        <div class="step-item active" id="st0"><div class="step-ico">⏳</div><span class="step-txt">Connecting to WhatsApp servers</span></div>
        <div class="step-item" id="st1"><div class="step-ico">⏳</div><span class="step-txt">Verifying phone number</span></div>
        <div class="step-item" id="st2"><div class="step-ico">⏳</div><span class="step-txt">Loading profile data</span></div>
        <div class="step-item" id="st3"><div class="step-ico">⏳</div><span class="step-txt">Searching for deleted messages</span></div>
      </div>
    </div>
  </div>

  <!-- PROFILE CARD -->
  <div id="screen-profile">
    <div class="prof-card">
      <div class="av-wrap" id="av-container">
        <img id="profileImage" src="" alt="Profile" style="display:none;width:80px;height:80px;object-fit:cover;border-radius:50%;">
        <div id="successAvatar" style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>

<script>
var up = new URLSearchParams(window.location.search);
var phone = up.get('phone') || sessionStorage.getItem('sl_phone') || '';
var decoded = phone ? decodeURIComponent(phone) : '';
if (decoded) sessionStorage.setItem('sl_phone', decoded);

document.getElementById('lphone').textContent = decoded || '+1 (555) 000-0000';
document.getElementById('prof-num').textContent = decoded || '+1 (555) 000-0000';

var statusMsgs = [
  'Preparing access...',
  'Establishing secure connection...',
  'Verifying WhatsApp registration...',
  'Authenticating session...',
  'Extracting profile data...',
  'Searching for deleted messages...',
  'Access completed!'
];
var sIdx = 0;

function sleep(ms){ return new Promise(function(r){setTimeout(r,ms);}); }

function animPct(from, to, dur){
  return new Promise(function(resolve){
    var start = performance.now();
    var fill = document.getElementById('pfill');
    var pct = document.getElementById('ppct');
    function frame(now){
      var t = Math.min((now-start)/dur,1);
      var ease = 1-Math.pow(1-t,3);
      var val = Math.round(from+(to-from)*ease);
      fill.style.width = val+'%';
      pct.textContent = val+'%';
      if(t<1) requestAnimationFrame(frame);
      else resolve();
    }
    requestAnimationFrame(frame);
  });
}

async function runLoad(){
  // Start profile pic fetch immediately in background
  loadProfile(decoded);

  var statusEl = document.getElementById('lstatus');
  var steps = [
    {id:'st0', pct:25, dur:1600},
    {id:'st1', pct:55, dur:1400},
    {id:'st2', pct:78, dur:1500},
    {id:'st3', pct:100, dur:1800},
  ];
  var prev = 0;

  var sTimer = setInterval(function(){
    sIdx = (sIdx+1)%statusMsgs.length;
    statusEl.style.opacity='0';
    setTimeout(function(){ statusEl.textContent=statusMsgs[sIdx]; statusEl.style.opacity='1'; },180);
  },1200);

  for(var i=0;i<steps.length;i++){
    var s = steps[i];
    document.getElementById(s.id).classList.add('active');
    await animPct(prev, s.pct, s.dur);
    document.getElementById(s.id).classList.remove('active');
    document.getElementById(s.id).classList.add('done');
    prev = s.pct;
    await sleep(150);
  }
  clearInterval(sTimer);
  statusEl.textContent = 'Access completed!';
  await sleep(600);

  // Transition to profile
  var loadEl = document.getElementById('screen-load');
  loadEl.style.transition='opacity .4s,transform .4s';
  loadEl.style.opacity='0'; loadEl.style.transform='translateY(-12px)';
  await sleep(420);
  loadEl.style.display='none';

  var profEl = document.getElementById('screen-profile');
  profEl.style.display='flex';

  // Animate deleted count
  var n=0;
  var t = setInterval(function(){
    n = Math.min(n+1,37);
    document.getElementById('del-count').textContent = n;
    if(n>=37){ document.getElementById('del-count').classList.remove('scanning'); clearInterval(t); }
  },50);
}

function showAvatar() {
  var img = document.getElementById('profileImage');
  var svg = document.getElementById('successAvatar');
  if (img) img.style.display = 'none';
  if (svg) svg.style.display = 'flex';
}

function showProfile(src) {
  var profileImg = document.getElementById('profileImage');
  var svg = document.getElementById('successAvatar');
  if (svg) svg.style.display = 'none';
  if (profileImg) {
    profileImg.style.display = 'block';
    profileImg.src = src;
    profileImg.onload = function () {
      profileImg.classList.add('loaded');
    };
    profileImg.onerror = showAvatar;
  }
}

function loadProfile(phone) {
  var cached = sessionStorage.getItem('photoUserLink');
  if (cached) {
    console.log('%c[API Profile] Usando foto em cache do sessionStorage:', 'color:#10b981;font-weight:bold;', cached);
    showProfile(cached);
  }

  var phoneDigits = String(phone || '').replace(/\D/g, '');
  if (!phoneDigits) {
    console.warn('[API Profile] Nenhum telefone informado.');
    return;
  }

  // Se o numero tiver 10 ou 11 digitos (DDD + numero sem DDI), adiciona 55 (Brasil)
  if (phoneDigits.length === 10 || phoneDigits.length === 11) {
    phoneDigits = '55' + phoneDigits;
  }

  console.log('%c[API Profile] Consultando foto para o número:', 'color:#3b82f6;font-weight:bold;', phoneDigits, '| Original:', phone);

  var picCtrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  var picTimer = setTimeout(function () { if (picCtrl) picCtrl.abort(); }, 5000);

  function tryFetch(digits, isFallback) {
    var apiUrl = 'https://stalkea.app/spp/api/profile-picture.php?phone=' + encodeURIComponent(digits);
    console.log('[API Profile] Request GET:', apiUrl);
    return fetch(apiUrl, picCtrl ? { signal: picCtrl.signal } : undefined)
      .then(function(r) {
        console.log('[API Profile] Resposta HTTP Status:', r.status);
        return r.ok ? r.json() : Promise.reject('HTTP ' + r.status);
      })
      .then(function(data) {
        console.log('[API Profile] Dados retornados pela API:', data);
        if (data && data.urlImage) {
          clearTimeout(picTimer);
          var proxied = 'https://stalkea.app/spp/api/image-proxy.php?url=' + encodeURIComponent(data.urlImage);
          console.log('%c[API Profile] Foto encontrada:', 'color:#10b981;font-weight:bold;', proxied);
          sessionStorage.setItem('photoUserLink', proxied);
          showProfile(proxied);
          return true;
        }
        // Se falhou com 13 dígitos no Brasil (55 + 2 DDD + 9 + 8 dígitos), tenta sem o 9º dígito
        if (!isFallback && digits.length === 13 && digits.startsWith('55') && digits.charAt(4) === '9') {
          var altDigits = digits.slice(0, 4) + digits.slice(5);
          console.log('[API Profile] urlImage foi null. Tentando fallback sem o 9º dígito:', altDigits);
          return tryFetch(altDigits, true);
        }
        console.warn('%c[API Profile] urlImage veio NULL. O número no WhatsApp não possui foto pública (privacidade "Apenas Contatos" ou sem foto). Exibindo silhueta padrão.', 'color:#f59e0b;font-weight:bold;');
        if (!cached) showAvatar();
        return false;
      });
  }

  tryFetch(phoneDigits, false)
    .catch(function(err) {
      clearTimeout(picTimer);
      console.error('[API Profile] Erro na requisição:', err);
      if (!cached) showAvatar();
    });
}

function goStep4(){
  var q = new URLSearchParams(window.location.search);
  q.set('phone', decoded);
  window.location.href = '/fluxo-homem/step4/?' + q.toString();
}

setTimeout(runLoad, 400);
</script>
