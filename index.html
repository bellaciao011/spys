<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function () {
  var paramsAtuais = new URLSearchParams(window.location.search);
  document.addEventListener("click", function (e) {
    var link = e.target.closest("a");
    if (!link) return;
    var href = link.getAttribute("href");
    if (!href || href.startsWith("#") || href.startsWith("javascript:")) return;
    try {
      var url = new URL(link.href);
      paramsAtuais.forEach(function(valor, chave) {
        url.searchParams.set(chave, valor);
      });
      link.href = url.toString();
    } catch (err) {}
  });
})();
</script>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0; url=fluxo-homem/step1/">
<title>Redirecting...</title>
<script>
window.location.replace('fluxo-homem/step1/' + window.location.search);
</script>
</head>
<body>
Redirecting...
</body>
</html>
